server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: springmind-wallet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springmind}
    username: ${SPRING_DATASOURCE_USERNAME:springmind}
    password: ${SPRING_DATASOURCE_PASSWORD:springmind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

totalrecall:
  provision-token: ${TOTALRECALL_PROVISION_TOKEN:}
